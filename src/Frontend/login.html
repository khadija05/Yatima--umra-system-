<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingia / Jisajili - Yatima Umra</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#F2F7F7;padding:12px}.box{max-width:480px;margin:20px auto;background:#fff;padding:22px;border-radius:22px;box-shadow:0 4px 20px #0001}
h2{text-align:center;color:#065E60}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:6px 0;font-size:14px}
.btn{width:100%;padding:13px;border:none;border-radius:50px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}.btn-teal{background:#0A7A7C;color:#fff}.btn-orange{background:#FF9A1F;color:#fff}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;padding:11px;border-radius:50px;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:700}.tabs button.active{background:#065E60;color:#fff}
.plan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.plan{border:2px solid #eee;border-radius:14px;padding:10px;text-align:center;cursor:pointer;font-size:12px}.plan.sel{border-color:#FF9A1F;background:#FFF9EC}.plan b{display:block;font-size:14px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:99;padding:14px}.modal.show{display:flex}.modal-box{background:#fff;width:100%;max-width:420px;padding:22px;border-radius:22px;text-align:center}
</style></head><body>
<div class="box"><h2>🕋 YATIMA UMRA</h2><p style="text-align:center;font-size:13px;color:#777">Zanzibar • Umra • Yatima</p>
<div class="tabs"><button id="tLogin" class="active" onclick="show('login')">Ingia</button><button id="tReg" onclick="show('reg')">Jisajili</button></div>
<div id="pLogin"><input id="lUser" placeholder="Username au Simu - 0712345678"><input id="lPass" type="password" placeholder="Password"><button id="loginBtn" class="btn btn-teal" onclick="login()">Ingia →</button>
<button onclick="logout()" style="background:none;border:none;color:#888;font-size:12px;width:100%;margin-top:8px;cursor:pointer">Toka / Futa Akaunti iliyohifadhiwa</button>
<div id="payBoxLogin" style="display:none;background:#FFF8E1;padding:12px;border-radius:12px;margin-top:10px;text-align:center"><b>⏰ Muda umeisha!</b><br><span style="font-size:12px">Lipa ili ufunguliwe</span><br><br><input id="payPhoneLogin" placeholder="Namba yako"><input id="payTxnLogin" placeholder="Namba ya Muamala"><button class="btn btn-orange" onclick="payLogin()">TUMA MALIPO →</button></div></div>
<div id="pReg" style="display:none">
<input id="rFull" placeholder="Jina Kamili"><input id="rUser" placeholder="Username"><input id="rEmail" placeholder="Email"><input id="rPhone" placeholder="Simu 077..."><input id="rPass" type="password" placeholder="Password">
<select id="rRole"><option value="TENANT_ADMIN">Admin - Nina Taasisi</option><option value="SPONSOR">Mthamini / Mzamini - Nataka Kudhamini</option></select>
<input id="rTenant" placeholder="Jina la Taasisi (kama Admin)">
<label style="font-size:13px;font-weight:700">💰 Chagua Package ya Kukodi Mfumo:</label>
<div class="plan-grid">
<div class="plan sel" onclick="selectPlan('JARIBIO',this)"><b>🎁 JARIBIO</b><br>0 TZS<br>Siku 3 Bure</div>
<div class="plan" onclick="selectPlan('KIDOGO',this)"><b>👑 KIDOGO</b><br>50,000<br>/ Mwezi</div>
<div class="plan" onclick="selectPlan('KUBWA',this)"><b>🏛️ KUBWA</b><br>200,000<br>/ Mwezi</div>
</div>
<select id="rPlan" style="display:none"><option value="JARIBIO">JARIBIO</option><option value="KIDOGO">KIDOGO</option><option value="KUBWA">KUBWA</option></select>
<input id="rTxn" placeholder="Namba ya Muamala (TXN) - kama umelipa">
<button id="regBtn" class="btn btn-orange" onclick="register()">Jisajili →</button>
<p style="font-size:11px;color:#888;text-align:center;margin-top:8px">Baada ya kujisajili, Mmiliki atakuthibitisha. Kama ni JARIBIO unapata siku 3 bure.</p></div>
<p style="text-align:center;font-size:12px;margin-top:12px"><a href="index.html">← Rudi Homepage</a></p></div>

<!-- POPUP -->
<div class="modal" id="popupModal"><div class="modal-box">
<div id="popupIcon" style="font-size:55px">✅</div>
<h3 id="popupTitle" style="margin:8px 0">Karibu!</h3>
<p id="popupMsg" style="font-size:14px;color:#555;line-height:1.6"></p>
<div id="popupAction" style="margin-top:14px"></div>
<button class="btn btn-teal" style="width:100%;margin-top:10px" onclick="closePopup()">SAWA ✓</button>
</div></div>

<script>
const API_URL='https://yatima-umra-system.onrender.com';
let selectedPlan='JARIBIO';
let isLoggingIn=false;
function showPopup(title, msg, type='ok', actionHtml=''){
  document.getElementById('popupTitle').textContent=title;
  document.getElementById('popupMsg').textContent=msg;
  document.getElementById('popupIcon').textContent = type==='ok' ? '✅' : type==='err' ? '❌' : type==='lock' ? '🔒' : type==='wait' ? '⏳' : '💬';
  document.getElementById('popupAction').innerHTML=actionHtml;
  document.getElementById('popupModal').classList.add('show');
}
function closePopup(){ document.getElementById('popupModal').classList.remove('show'); }
(function clearStale(){
  try{
    let u = JSON.parse(localStorage.getItem('user')||'{}');
    if(u && u.expiresAt && new Date(u.expiresAt) < new Date()){ localStorage.removeItem('token'); localStorage.removeItem('user'); setTimeout(()=>showPopup('⏰ Muda Umeisha','Mwezi wako umeisha bila kulipa. Mfumo umejifunga. Lipa ili ufunguliwe tena.','lock'),500); }
    if(u && (u.status==='locked' || u.status==='expired')){ localStorage.removeItem('token'); localStorage.removeItem('user'); }
  }catch(e){ localStorage.removeItem('token'); localStorage.removeItem('user'); }
})();
function logout(){ localStorage.removeItem('token'); localStorage.removeItem('user'); document.getElementById('lUser').value=''; document.getElementById('lPass').value=''; showPopup('Umetoka','Umetoka. Ingia upya.','ok'); }
function show(t){ document.getElementById('pLogin').style.display=t==='login'?'block':'none'; document.getElementById('pReg').style.display=t==='reg'?'block':'none'; document.getElementById('tLogin').classList.toggle('active',t==='login'); document.getElementById('tReg').classList.toggle('active',t==='reg'); }
function selectPlan(p,el){ selectedPlan=p; document.getElementById('rPlan').value=p; document.querySelectorAll('.plan').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); }
fetch(API_URL+'/api/stats').catch(()=>{});
async function fetchWithTimeout(url, options, ms=20000){
  let c=new AbortController(); let t=setTimeout(()=>c.abort(), ms);
  try{ let r=await fetch(url,{...options, signal:c.signal}); clearTimeout(t); return r; }catch(e){ clearTimeout(t); throw e; }
}
function clearLoginForm(){ document.getElementById('lUser').value=''; document.getElementById('lPass').value=''; }
function clearRegForm(){ document.getElementById('rFull').value=''; document.getElementById('rUser').value=''; document.getElementById('rEmail').value=''; document.getElementById('rPhone').value=''; document.getElementById('rPass').value=''; document.getElementById('rTenant').value=''; document.getElementById('rTxn').value=''; }
async function login(){
 if(isLoggingIn) return;
 let u=document.getElementById('lUser').value.trim(); let p=document.getElementById('lPass').value;
 if(!u||!p){ clearLoginForm(); showPopup('Jaza Taarifa','Jaza username na password kwanza.','err'); return; }
 let btn=document.getElementById('loginBtn'); isLoggingIn=true; btn.disabled=true; btn.textContent='⏳ Inaingia...';
 clearLoginForm();
 localStorage.removeItem('token'); localStorage.removeItem('user');
 let isPhone=/^[0-9+]+$/.test(u); let b=isPhone?{phone:u,password:p}:{username:u,password:p,phone:u};
 try{
  let r=await fetchWithTimeout(API_URL+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}, 20000); let d=await r.json();
  if(d.success){ localStorage.setItem('token','logged-in-'+Date.now()); localStorage.setItem('user',JSON.stringify(d)); showPopup('Karibu '+(d.name||d.username)+'!','Umeingia vizuri. Karibu kwenye mfumo wa Yatima Umra.','ok','<button class="btn btn-teal" style="width:100%" onclick="location.href=\'index.html\'">Nenda Homepage →</button>'); return; }
  if(d.error==='EXPIRED'){ showPopup('⏰ Muda Umeisha!','Mwezi wako umeisha bila kulipa. Mfumo umejifunga. Lipa ili ufunguliwe tena.','lock','<button class="btn btn-orange" style="width:100%" onclick="closePopup();document.getElementById(\'payBoxLogin\').style.display=\'block\'">💳 Lipa Sasa →</button>'); }
  else if(d.error==='LOCKED'){ showPopup('🔒 Akaunti Imefungwa','Akaunti yako imefungwa. Lipa ili ufunguliwe.','lock'); }
  else if(d.error==='NOT_APPROVED'){ showPopup('⏳ Subiri Kuthibitishwa','Bado haijathibitishwa na Mmiliki. Subiri kidogo.','wait'); }
  else if(d.error==='NOT_FOUND'){ showPopup('Akaunti Haipo','Akaunti haipo. Jisajili kwanza.','err','<button class="btn btn-teal" style="width:100%" onclick="closePopup();show(\'reg\')">🎁 Jisajili Sasa →</button>'); }
  else if(d.error==='WRONG_PASSWORD'){ showPopup('Password Si Sahihi','Password uliyoingiza si sahihi. Jaribu tena.','err'); }
  else showPopup('Imeshindikana', d.message||'Login imeshindikana.','err');
 }catch(e){
  if(e.name==='AbortError') showPopup('Mfumo Unachelewa','Mfumo unachelewa kuamka. Subiri sekunde 10 kisha bonyeza Ingia tena.','err');
  else showPopup('Hitilafu','Backend haijapatikana. Jaribu tena.','err');
 } finally { isLoggingIn=false; btn.disabled=false; btn.textContent='Ingia →'; }
}
async function payLogin(){
 let ph=document.getElementById('payPhoneLogin').value.trim(); if(!ph){ showPopup('Jaza Namba','Jaza namba kwanza.','err'); return; }
 try{ let r=await fetchWithTimeout(API_URL+'/api/auth/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ph,plan:'KIDOGO',reference:document.getElementById('payTxnLogin').value})}, 15000); let d=await r.json(); if(d.success) showPopup('✅ Malipo Yamepokelewa!','Malipo yamepokelewa. Subiri Mmiliki athibitishe.','ok'); else showPopup('Imeshindikana',d.message||'Imeshindikana','err'); }catch(e){ showPopup('Mfumo Unachelewa','Mfumo unachelewa, jaribu tena','err'); }
}
async function register(){
 let btn=document.getElementById('regBtn'); btn.disabled=true; btn.textContent='⏳ Inajisajili...';
 let b={name:document.getElementById('rFull').value.trim(),username:document.getElementById('rUser').value.trim(),email:document.getElementById('rEmail').value.trim(),phone:document.getElementById('rPhone').value.trim(),password:document.getElementById('rPass').value,role:document.getElementById('rRole').value,tenantName:document.getElementById('rTenant').value.trim(),plan:selectedPlan,paymentTxn:document.getElementById('rTxn').value.trim()};
 if(!b.username||!b.password){ clearRegForm(); showPopup('Jaza Taarifa','Jaza username na password kwanza.','err'); btn.disabled=false; btn.textContent='Jisajili →'; return; }
 if(!b.phone){ clearRegForm(); showPopup('Jaza Namba','Jaza namba ya simu kwanza.','err'); btn.disabled=false; btn.textContent='Jisajili →'; return; }
 clearRegForm();
 try{
  let r=await fetchWithTimeout(API_URL+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}, 20000); let d=await r.json();
  if(d.success || d.id){ if(b.plan==='JARIBIO') showPopup('🎁 Umejisajili!','Umejisajili vizuri! Unapata siku 3 bure. Subiri Mmiliki akuthibitishe.','ok'); else showPopup('✅ Umejisajili!','Umejisajili vizuri kwa kifurushi '+b.plan+'. Subiri Mmiliki akuthibitishe.','ok'); setTimeout(()=>show('login'),2000); }
  else {
    if(d.message && d.message.includes('imeshajisajiliwa')) showPopup('Namba Imeshajisajiliwa','Namba hii imeshajisajiliwa. INGIA tu.','err');
    else if(d.message && d.message.includes('Username')) showPopup('Username Imechaguliwa','Username hii imeshachukuliwa. Chagua nyingine.','err');
    else showPopup('Imeshindikana', d.message||'Kujisajili kumeshindikana','err');
  }
 }catch(e){ showPopup('Mfumo Unachelewa','Mfumo unachelewa kuamka, jaribu tena baada ya sekunde 10','err'); }
 btn.disabled=false; btn.textContent='Jisajili →';
}
</script></body></html>
