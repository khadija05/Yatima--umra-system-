<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ingia - Mayatima Zanzibar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#F2F7F7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#fff;width:100%;max-width:460px;padding:24px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.back{display:inline-block;margin-bottom:16px;text-decoration:none;color:#065E60;font-weight:700;background:#EAF7F7;padding:8px 16px;border-radius:50px;font-size:14px}
.logo{text-align:center;margin-bottom:6px}.logo b{font-size:22px;color:#065E60}.logo p{font-size:13px;color:#777;margin-top:4px}
input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:6px 0;font-size:14px}
label{font-weight:700;font-size:14px;display:block;margin-top:14px;color:#333}
.btn{width:100%;padding:14px;border:none;border-radius:50px;font-weight:700;margin-top:14px;cursor:pointer;font-size:15px}
.btn-teal{background:#0A7A7C;color:#fff}.btn-teal:disabled{background:#999;cursor:wait}
.btn-orange{background:#FF9A1F;color:#fff}.btn-orange:disabled{background:#ccc;cursor:not-allowed}
.btn-grey{background:#F3F4F6;color:#333}
.info{background:#EAF7F7;padding:12px;border-radius:12px;font-size:13px;margin-top:15px;text-align:center;color:#065E60;line-height:1.6}
.warn{background:#FFE6E6;padding:14px;border-radius:12px;text-align:center;font-weight:700;color:#991b1b;font-size:14px;display:none}
.success{background:#DCFCE7;padding:14px;border-radius:12px;text-align:center;font-weight:700;color:#166534;font-size:14px;display:none}
#debug{font-size:12px;color:#888;text-align:center;margin-top:10px}
@media(max-width:600px){.card{padding:18px}}
</style></head>
<body>
<div class="card">
<a href="index.html" class="back">← 🏠 Rudi Nyumbani</a>
<div class="logo"><b>🤲 MAYATIMA ZANZIBAR</b><p>Ingia ili uone malipo na kuchangia</p></div>

<div id="alreadyBox" class="warn"></div>
<div id="successBox" class="success"></div>

<label>👤 Username / 📱 Simu</label>
<input id="phone" type="text" placeholder="Mf: 077... au username" autocomplete="username">

<label>🔒 Password</label>
<input id="password" type="password" placeholder="Weka password yako" autocomplete="current-password">

<label>🏢 Taasisi (kama unajisajili kama Taasisi - hiari)</label>
<input id="org" type="text" placeholder="Mf: Taasisi ya Mayatima Unguja">

<label>📦 Plan (kama Taasisi)</label>
<select id="plan"><option value="FREE-DEMO">🆓 FREE-DEMO - Siku 3 Bure</option><option value="KIDOGO">🌱 KIDOGO - 50,000 / Mwezi</option><option value="KAWAIDA">⭐ KAWAIDA - 100,000 / Mwezi</option><option value="SPECIAL">💚 SPECIAL - 150,000 / Mwezi</option></select>

<button type="button" id="loginBtn" class="btn btn-teal">Ingia →</button>
<button type="button" id="registerBtn" class="btn btn-orange">Jisajili Bure →</button>
<button type="button" id="clearBtn" class="btn btn-grey" style="display:none;">🧹 Tumia Namba Nyingine / Futa Iliyohifadhiwa</button>

<div class="info">Huna akaunti? Bonyeza <b>Jisajili Bure</b>.<br><small>Baada ya kujisajili, fomu itafutwa na utaambiwa uingie.</small></div>
<div id="debug"></div>
<div style="text-align:center;margin-top:14px;"><a href="index.html" style="color:#888;font-size:13px;">← Rudi bila Kuingia</a></div>
</div>

<script>
const API="https://yatima-umra-backend.onrender.com";
const phoneEl=document.getElementById('phone');
const passEl=document.getElementById('password');
const orgEl=document.getElementById('org');
const planEl=document.getElementById('plan');
const loginBtn=document.getElementById('loginBtn');
const registerBtn=document.getElementById('registerBtn');
const clearBtn=document.getElementById('clearBtn');
const alreadyBox=document.getElementById('alreadyBox');
const successBox=document.getElementById('successBox');
const debugEl=document.getElementById('debug');

function log(m){ debugEl.textContent=m; console.log(m); }
function clearAllFields(){
  phoneEl.value=""; passEl.value=""; orgEl.value=""; planEl.selectedIndex=0;
}

// === FIX KUBWA: Usizuie Login kwa sababu ya localStorage ===
// Zamani: kama yatima_user ipo, register inazimwa milele na simu inajazwa 0778709707
// Sasa: tunaonyesha tu ujumbe, lakini Login na Register zinaendelea kufanya kazi.
// Na kuna button ya kufuta iliyohifadhiwa.
function checkSaved(){
  try{
    const saved=localStorage.getItem("yatima_user");
    if(saved){
      const u=JSON.parse(saved);
      // Onyesha ujumbe lakini USIZIME button
      alreadyBox.style.display='block';
      alreadyBox.innerHTML='ℹ️ Kwenye hii simu kuna akaunti iliyohifadhiwa.<br><small>Unaweza kuingia moja kwa moja au kubonyeza "Tumia Namba Nyingine" chini.</small>';
      clearBtn.style.display='block';
      // Jaza simu tu ili kuingia iwe rahisi, lakini mtu anaweza kuibadilisha
      if(u.phone && !phoneEl.value) phoneEl.value=u.phone;
      // USIZIME registerBtn hapa - ndiyo ilikuwa inakuletea "⛔ Umesajisajili Tayari" kila wakati
    }
  }catch(e){}
}
checkSaved();

// Button mpya: Futa akaunti iliyohifadhiwa - inatatua tatizo lako la 0778709707 kukwama
clearBtn.addEventListener('click', function(){
  localStorage.removeItem("yatima_user");
  localStorage.removeItem("yatima_logged_in");
  localStorage.removeItem("yatima_registered");
  clearAllFields();
  alreadyBox.style.display='none';
  successBox.style.display='block';
  successBox.innerHTML='✅ Imefutwa! Sasa andika namba mpya na ujisajili / uingie.';
  clearBtn.style.display='none';
  registerBtn.disabled=false;
  registerBtn.textContent='Jisajili Bure →';
  phoneEl.focus();
  log("Imefutwa - sasa unaweza kuingiza namba mpya");
});

// LOGIN - haijazuiwa tena
loginBtn.addEventListener('click', async function(){
  const phone=phoneEl.value.trim();
  const password=passEl.value.trim();
  if(!phone||!password){ alert("Jaza simu na password kwanza"); return; }
  loginBtn.disabled=true; loginBtn.textContent='⏳ Ina-ingia...';
  log("Inajaribu kuingia kama "+phone+"...");
  try{
    const res=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,username:phone,password})});
    const u=await res.json();
    console.log("Login:",u);
    if(u.error==="EXPIRED"){ alert(u.message||"Jaribio limeisha"); loginBtn.disabled=false; loginBtn.textContent='Ingia →'; return; }
    if(res.ok && !u.error){
      const safe={id:u.id,username:u.username,name:u.name,phone:u.phone,role:u.role,plan:u.plan,status:u.status,org:u.org};
      try{ localStorage.setItem("yatima_user",JSON.stringify(safe)); localStorage.setItem("yatima_logged_in","true"); }catch(e){}
      passEl.value="";
      log("✅ Umefanikiwa kuingia!");
      if(u.role==="OWNER") window.location.href="owner.html";
      else if(u.role==="ADMIN") window.location.href="admin.html";
      else window.location.href="index.html";
    }else{
      alert("Login imefeli - angalia namba / password. Kama hujajisajili, bonyeza Jisajili Bure.");
      loginBtn.disabled=false; loginBtn.textContent='Ingia →';
    }
  }catch(e){
    alert("Backend haijibu. Fungua https://yatima-umra-backend.onrender.com/api/orphans kwanza, subiri 30s, ujaribu tena.");
    loginBtn.disabled=false; loginBtn.textContent='Ingia →';
  }
});

// REGISTER - inafanya kazi + inafuta field baada ya kujisajili
registerBtn.addEventListener('click', async function(){
  const phone=phoneEl.value.trim();
  const password=passEl.value.trim();
  const org=orgEl.value.trim();
  const plan=planEl.value;
  if(!phone||!password){ alert("Jaza simu na password kwanza"); return; }
  // Kama namba hii ndiyo ile iliyohifadhiwa, mwambie aingie badala ya kujisajili tena
  try{
    const saved=localStorage.getItem("yatima_user");
    if(saved){
      const u=JSON.parse(saved);
      if(u.phone===phone){ alert("⛔ Namba hii imeshajisajiliwa kwenye hii simu. Bonyeza INGIA badala ya kujisajili tena. Kama ni namba nyingine, bonyeza 'Tumia Namba Nyingine' kwanza."); return; }
    }
  }catch(e){}
  registerBtn.disabled=true; registerBtn.textContent='⏳ Inajisajili...';
  log("Inajaribu kujisajili...");
  try{
    try{
      const c=await fetch(API+"/api/auth/check/"+encodeURIComponent(phone));
      const cj=await c.json();
      if(cj.exists){ alert("⛔ Namba hii imeshajisajiliwa. Tafadhali INGIA tu."); clearAllFields(); registerBtn.disabled=false; registerBtn.textContent='Jisajili Bure →'; return; }
    }catch(e){}
    const r=await fetch(API+"/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:phone,name:phone,phone,password,role:org?"ADMIN":"Mthamini",org:org,plan:plan})});
    const j=await r.json();
    console.log("Register:",j);
    if(j.error==="ALREADY_REGISTERED"){ alert("⛔ "+j.message); clearAllFields(); registerBtn.disabled=false; registerBtn.textContent='Jisajili Bure →'; return; }
    if(r.ok){
      clearAllFields();
      try{ localStorage.setItem("yatima_registered","true"); }catch(e){}
      successBox.style.display='block';
      successBox.innerHTML='✅ Umejisajili! Sasa INGIA kwa namba na password yako.<br><small>Fomu imefutwa kwa usalama.</small>';
      alreadyBox.style.display='none';
      log("✅ Umejisajili! Fomu imefutwa. Sasa Ingia.");
      alert("✅ Umejisajili! Sasa INGIA. Fomu imefutwa.");
      registerBtn.disabled=false; registerBtn.textContent='Jisajili Bure →';
      phoneEl.focus();
    }else{ alert("Kujisajili kumefeli, jaribu tena"); registerBtn.disabled=false; registerBtn.textContent='Jisajili Bure →'; }
  }catch(e){
    passEl.value="";
    alert("Backend haijibu. Fungua https://yatima-umra-backend.onrender.com/api/orphans kwanza, subiri 30s, ujaribu tena.");
    registerBtn.disabled=false; registerBtn.textContent='Jisajili Bure →';
  }
});

passEl.addEventListener('keydown', function(e){ if(e.key==="Enter"){ e.preventDefault(); loginBtn.click(); } });
phoneEl.addEventListener('keydown', function(e){ if(e.key==="Enter"){ e.preventDefault(); loginBtn.click(); } });
log("Ukurasa umeandaliwa - bonyeza Ingia / Jisajili");
</script></body></html>
