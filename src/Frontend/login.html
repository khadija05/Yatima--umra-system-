<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingia / Jisajili - Yatima Umra</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#F2F7F7;padding:12px}.box{max-width:480px;margin:20px auto;background:#fff;padding:22px;border-radius:22px;box-shadow:0 4px 20px #0001}
h2{text-align:center;color:#065E60}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:6px 0;font-size:14px}
.btn{width:100%;padding:13px;border:none;border-radius:50px;font-weight:700;cursor:pointer}.btn-teal{background:#0A7A7C;color:#fff}.btn-orange{background:#FF9A1F;color:#fff}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;padding:11px;border-radius:50px;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:700}.tabs button.active{background:#065E60;color:#fff}
#msgBox{display:none;padding:12px;border-radius:12px;margin:10px 0;font-weight:700;font-size:13px;text-align:center}
.plan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.plan{border:2px solid #eee;border-radius:14px;padding:10px;text-align:center;cursor:pointer;font-size:12px}.plan.sel{border-color:#FF9A1F;background:#FFF9EC}.plan b{display:block;font-size:14px}
</style></head><body>
<div class="box"><h2>🕋 YATIMA UMRA</h2><p style="text-align:center;font-size:13px;color:#777">Zanzibar • Umra • Yatima</p>
<div class="tabs"><button id="tLogin" class="active" onclick="show('login')">Ingia</button><button id="tReg" onclick="show('reg')">Jisajili</button></div>
<div id="msgBox"></div>
<div id="pLogin"><input id="lUser" placeholder="Username au Simu - 0712345678"><input id="lPass" type="password" placeholder="Password"><button class="btn btn-teal" onclick="login()">Ingia →</button>
<div id="payBoxLogin" style="display:none;background:#FFF8E1;padding:12px;border-radius:12px;margin-top:10px;text-align:center"><b>⏰ Muda umeisha!</b><br><span style="font-size:12px">Lipa ili ufunguliwe</span><br><br><input id="payPhoneLogin" placeholder="Namba yako"><input id="payTxnLogin" placeholder="Namba ya Muamala"><button class="btn btn-orange" onclick="payLogin()">TUMA MALIPO →</button></div></div>
<div id="pReg" style="display:none">
<input id="rFull" placeholder="Jina Kamili"><input id="rUser" placeholder="Username"><input id="rEmail" placeholder="Email"><input id="rPhone" placeholder="Simu 077..."><input id="rPass" type="password" placeholder="Password">
<select id="rRole"><option value="TENANT_ADMIN">Admin - Nina Taasisi</option><option value="SPONSOR">Mthamini / Mzamini - Nataka Kudhamini</option></select>
<input id="rTenant" placeholder="Jina la Taasisi (kama Admin)">
<label style="font-size:13px;font-weight:700">💰 Chagua Package ya Kukodi Mfumo:</label>
<div class="plan-grid">
<div class="plan sel" onclick="selectPlan('JARIBIO',this)"><b>🎁 JARIBIO</b><br>0 TZS<br>Siku 3 Bure</div>
<div class="plan" onclick="selectPlan('KIDOGO',this)"><b>👑 KIDOGO</b><br>50,000<br>/ Mwezi</div>
<div class="plan" onclick="selectPlan('KUBWA',this)"><b>🏛️ KUBWA</b><br>200,000<br>/ Mwezi</div>
</div>
<select id="rPlan" style="display:none"><option value="JARIBIO">JARIBIO</option><option value="KIDOGO">KIDOGO</option><option value="KUBWA">KUBWA</option></select>
<input id="rTxn" placeholder="Namba ya Muamala (TXN) - kama umelipa">
<button class="btn btn-orange" onclick="register()">Jisajili →</button>
<p style="font-size:11px;color:#888;text-align:center;margin-top:8px">Baada ya kujisajili, Mmiliki atakuthibitisha. Kama ni JARIBIO unapata siku 3 bure.</p></div>
<p style="text-align:center;font-size:12px;margin-top:12px"><a href="index.html">← Rudi Homepage</a></p></div>
<script>
const API_URL='https://yatima-umra-system.onrender.com';
let selectedPlan='JARIBIO';
function showMsg(m,err){ let e=document.getElementById('msgBox'); e.style.display='block'; e.style.background=err?'#fee2e2':'#dcfce7'; e.style.color=err?'#991b1b':'#166534'; e.textContent=m; }
function show(t){ document.getElementById('pLogin').style.display=t==='login'?'block':'none'; document.getElementById('pReg').style.display=t==='reg'?'block':'none'; document.getElementById('tLogin').classList.toggle('active',t==='login'); document.getElementById('tReg').classList.toggle('active',t==='reg'); }
function selectPlan(p,el){ selectedPlan=p; document.getElementById('rPlan').value=p; document.querySelectorAll('.plan').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); }
async function login(){
 let u=document.getElementById('lUser').value.trim(); let p=document.getElementById('lPass').value;
 if(!u||!p) return showMsg('Jaza Username na Password',true);
 let isPhone=/^[0-9+]+$/.test(u); let b=isPhone?{phone:u,password:p}:{username:u,password:p,phone:u};
 try{
  let r=await fetch(API_URL+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); let d=await r.json();
  if(d.success){ localStorage.setItem('token','logged-in'); localStorage.setItem('user',JSON.stringify(d)); showMsg('Karibu '+(d.name||d.username)+'! ✅',false); setTimeout(()=>location.href='index.html',800); return; }
  showMsg(d.message||'Login imeshindikana',true);
  if(d.error==='EXPIRED'||d.error==='LOCKED'){ document.getElementById('payBoxLogin').style.display='block'; document.getElementById('payPhoneLogin').value=u; }
 }catch(e){ showMsg('Backend haijapatikana. Jaribu tena.',true); }
}
async function payLogin(){
 let ph=document.getElementById('payPhoneLogin').value.trim(); if(!ph) return alert('Jaza namba');
 let r=await fetch(API_URL+'/api/auth/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ph,plan:'KIDOGO',reference:document.getElementById('payTxnLogin').value})}); let d=await r.json(); if(d.success) showMsg('✅ Malipo yamepokelewa! Subiri Mmiliki athibitishe.',false); else showMsg(d.message||'Imeshindikana',true);
}
async function register(){
 let b={name:document.getElementById('rFull').value.trim(),username:document.getElementById('rUser').value.trim(),email:document.getElementById('rEmail').value.trim(),phone:document.getElementById('rPhone').value.trim(),password:document.getElementById('rPass').value,role:document.getElementById('rRole').value,tenantName:document.getElementById('rTenant').value.trim(),plan:selectedPlan,paymentTxn:document.getElementById('rTxn').value.trim()};
 if(!b.username||!b.password) return showMsg('Jaza Username na Password',true); if(!b.phone) return showMsg('Jaza Namba ya Simu',true);
 try{
  let r=await fetch(API_URL+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); let d=await r.json();
  if(d.success || d.id){ showMsg('✅ Umejisajili! Subiri Mmiliki akuthibitishe.',false); if(b.paymentTxn){ await fetch(API_URL+'/api/auth/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:b.phone,plan:b.plan,reference:b.paymentTxn})}); } setTimeout(()=>show('login'),1500); return; }
  showMsg(d.message||'Kujisajili kumeshindikana',true);
 }catch(e){ showMsg('Backend haijapatikana',true); }
}
</script></body></html>
