<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Dashboard - Yatima Umra</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f2f2f2;color:#222}
header{background:#0a7a42;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
header h2{margin:0;font-size:18px}
header button{background:#fff;color:#0a7a42;border:0;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.wrap{padding:14px;max-width:900px;margin:auto}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:#fff;padding:14px;border-radius:12px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.card b{font-size:24px;display:block}
.card span{font-size:13px;color:#666}
.search{background:#fff;padding:12px;border-radius:12px;margin-bottom:12px;display:flex;gap:8px}
.search input{flex:1;padding:11px;border:1px solid #ddd;border-radius:8px}
.search button{padding:11px 16px;background:#0a7a42;color:#fff;border:0;border-radius:8px}
.user{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.user .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.user h3{margin:0 0 4px;font-size:16px}
.user p{margin:2px 0;font-size:13px;color:#555}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:bold}
.badge.active{background:#d9f5e3;color:#0a7a42}
.badge.pending{background:#fff0c2;color:#8a6d00}
.badge.locked{background:#ffd6d6;color:#a00}
.badge.OWNER{background:#111;color:#fff}
.badge.ADMIN{background:#e0e7ff;color:#333}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btns button{padding:8px 12px;border:0;border-radius:8px;cursor:pointer;font-size:13px}
.approve{background:#0a7a42;color:#fff}
.lock{background:#e53935;color:#fff}
.unlock{background:#ff9800;color:#fff}
.refresh{background:#111;color:#fff}
.empty{text-align:center;padding:30px;color:#888;background:#fff;border-radius:12px}
#msg{text-align:center;color:red;margin:8px 0}
@media(max-width:600px){.cards{grid-template-columns:1fr 1fr 1fr}.card b{font-size:19px}}
</style>
</head>
<body>

<script>
// 1. MLINZI WA OWNER - lazima awe Owner
const savedUser = JSON.parse(localStorage.getItem("user") || "{}");
const savedRole = (savedUser.role || localStorage.getItem("role") || "").toUpperCase().trim();
if(savedRole !== "OWNER"){
  window.location.href = "login.html";
}
</script>

<header>
  <div>
    <h2>👑 OWNER DASHBOARD</h2>
    <div id="ownerName" style="font-size:13px;opacity:.9">Karibu Owner</div>
  </div>
  <button onclick="logout()">Toka ↪</button>
</header>

<div class="wrap">
  <div class="cards">
    <div class="card"><b id="totalUsers">0</b><span>Watumiaji Wote</span></div>
    <div class="card"><b id="pendingUsers">0</b><span>Wanasubiri Kuidhinishwa</span></div>
    <div class="card"><b id="activeUsers">0</b><span>Active</span></div>
  </div>

  <div class="search">
    <input id="searchInput" placeholder="Tafuta kwa jina / namba / username..." oninput="renderUsers()">
    <button onclick="loadUsers()">⟳ Pakia</button>
  </div>

  <div id="msg"></div>
  <div id="list"></div>
</div>

<script>
const API = "https://yatima-umra-backend.onrender.com/api/auth";
let ALL_USERS = [];

document.getElementById("ownerName").textContent = "Karibu " + (savedUser.username || "Owner") + " • " + (savedUser.phone || "");

function logout(){
  localStorage.removeItem("user");
  localStorage.removeItem("role");
  localStorage.removeItem("username");
  localStorage.removeItem("phone");
  window.location.href = "login.html";
}

async function loadUsers(){
  const list = document.getElementById("list");
  const msg = document.getElementById("msg");
  msg.textContent = "";
  list.innerHTML = "<div class='empty'>Inapakia watumiaji...</div>";
  try{
    const res = await fetch(API + "/all");
    if(!res.ok) throw new Error("Server error");
    ALL_USERS = await res.json();
    renderUsers();
  }catch(e){
    console.error(e);
    list.innerHTML = "<div class='empty'>Server haipatikani. Subiri kidogo, jaribu tena.</div>";
  }
}

function renderUsers(){
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  const list = document.getElementById("list");

  let filtered = ALL_USERS.filter(u => {
    if(!q) return true;
    return (u.name||"").toLowerCase().includes(q) ||
           (u.phone||"").toLowerCase().includes(q) ||
           (u.username||"").toLowerCase().includes(q);
  });

  // Stats
  document.getElementById("totalUsers").textContent = ALL_USERS.length;
  document.getElementById("pendingUsers").textContent = ALL_USERS.filter(u => u.status === "pending").length;
  document.getElementById("activeUsers").textContent = ALL_USERS.filter(u => u.status === "active").length;

  if(filtered.length === 0){
    list.innerHTML = "<div class='empty'>Hakuna mtumiaji aliyepatikana.</div>";
    return;
  }

  list.innerHTML = filtered.map(u => {
    const status = u.status || "pending";
    const badgeClass = status === "active" ? "active" : status === "locked" ? "locked" : "pending";
    const badgeText = status === "active" ? "ACTIVE" : status === "locked" ? "LOCKED" : "PENDING";
    const isLocked = u.locked === true || status === "locked";

    return `
    <div class="user">
      <div class="top">
        <div>
          <h3>${escapeHtml(u.name || u.username || "Hana jina")} <span class="badge ${escapeHtml(u.role||"")}" style="background:#eee">${escapeHtml(u.role||"")}</span></h3>
          <p>📱 ${escapeHtml(u.phone||"-")} • 👤 ${escapeHtml(u.username||"-")}</p>
          <p>📧 ${escapeHtml(u.email||"-")} • 📦 Plan: ${escapeHtml(u.plan||"-")}</p>
          <p>🏢 Org: ${escapeHtml(u.org||"-")}</p>
        </div>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="btns">
        ${status !== "active" ? `<button class="approve" onclick="approveUser(${u.id})">✅ Kubali / Approve</button>` : ""}
        ${!isLocked ? `<button class="lock" onclick="lockUser(${u.id})">🔒 Funga</button>` : `<button class="unlock" onclick="unlockUser(${u.id})">🔓 Fungua</button>`}
      </div>
    </div>`;
  }).join("");
}

function escapeHtml(s){
  return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

async function approveUser(id){
  if(!confirm("Kubali huyu mtumiaji?")) return;
  await fetch(API + "/approve/" + id, {method:"PUT"});
  loadUsers();
}
async function lockUser(id){
  if(!confirm("Unataka kumfunga huyu mtumiaji?")) return;
  await fetch(API + "/lock/" + id, {method:"PUT"});
  loadUsers();
}
async function unlockUser(id){
  await fetch(API + "/unlock/" + id, {method:"PUT"});
  loadUsers();
}

// Pakia mara moja ukifungua page
loadUsers();
</script>
</body>
</html>
